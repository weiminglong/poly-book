[package]
name = "pb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
pb-types = { path = "../crates/pb-types" }
pb-book = { path = "../crates/pb-book" }
pb-wal = { path = "../crates/pb-wal" }
pb-service = { path = "../crates/pb-service" }
arbitrary = { version = "1", features = ["derive"] }
tempfile = "3"

[[bin]]
name = "fuzz_ws_deser"
path = "fuzz_targets/fuzz_ws_deser.rs"
doc = false

[[bin]]
name = "fuzz_fixed_price"
path = "fuzz_targets/fuzz_fixed_price.rs"
doc = false

[[bin]]
name = "fuzz_book_delta"
path = "fuzz_targets/fuzz_book_delta.rs"
doc = false

[[bin]]
name = "fuzz_wal_corruption"
path = "fuzz_targets/fuzz_wal_corruption.rs"
doc = false

[[bin]]
name = "fuzz_query_guard"
path = "fuzz_targets/fuzz_query_guard.rs"
doc = false

[workspace]
