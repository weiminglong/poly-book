[graph]
exclude-unpublished = true

[advisories]
# Detect unmaintained crates in the workspace and its direct dependencies
# (audit finding A.36); transitive-only unmaintained crates are not failed on to
# avoid breaking CI on upstreams we cannot control.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # bincode 1.3.3 is intentionally frozen: the maintainers consider it a
    # complete release needing no further updates, so RUSTSEC-2025-0141 is an
    # "unmaintained" notice, NOT a vulnerability. It is a direct dependency of
    # pb-wal's WAL frame codec; moving to bincode 2.x / postcard would change the
    # on-disk WAL format. Revisit if an actual security issue is reported.
    "RUSTSEC-2025-0141",
]
# The astral-tokio-tar advisories (0.5.6: RUSTSEC-2026-0066/0112/0113; 0.6.1:
# RUSTSEC-2026-0145) are resolved by pinning that test-only crate (pulled by the
# testcontainers dev dependency) to >=0.6.2 in Cargo.lock, so no ignore is needed.

[licenses]
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
# Surface duplicate transitive versions rather than allowing them unbounded
# (audit finding A.141); warn keeps it visible without failing CI.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
