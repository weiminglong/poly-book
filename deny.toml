[graph]
exclude-unpublished = true

[advisories]
unmaintained = "none"
yanked = "warn"
# astral-tokio-tar 0.5.6 advisories in the testcontainers dev dependency.
# Waiting for testcontainers to release with astral-tokio-tar >=0.6.1.
# - RUSTSEC-2026-0066: low-severity PAX extension validation issue.
# - RUSTSEC-2026-0112: PAX header desynchronization (file smuggling).
# - RUSTSEC-2026-0113: unpack_in can chmod directories via symlinks.
ignore = [
    "RUSTSEC-2026-0066",
    "RUSTSEC-2026-0112",
    "RUSTSEC-2026-0113",
]

[licenses]
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
