[feed]
ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
rest_url = "https://clob.polymarket.com"
gamma_url = "https://gamma-api.polymarket.com"
ping_interval_secs = 10
reconnect_base_delay_ms = 100
reconnect_max_delay_ms = 30000
rate_limit_requests = 1500
rate_limit_window_secs = 10

[storage]
parquet_base_path = "./data"
parquet_flush_interval_secs = 300
parquet_row_group_size = 65536
checkpoints_enabled = true
checkpoint_interval_secs = 60
clickhouse_url = "http://localhost:8123"
clickhouse_database = "poly_book"
clickhouse_batch_interval_secs = 1
clickhouse_batch_size = 10000

[metrics]
listen_addr = "0.0.0.0:9090"
endpoint = "/metrics"

[wal]
base_path = "./data/wal"
segment_size_mb = 64
max_segments = 16
max_consumer_lag_bytes = 268435456  # 256 MB

[api]
listen_addr = "0.0.0.0:3000"
default_depth = 20
max_depth = 200
stale_after_secs = 15
# Backend for historical queries: "parquet" or "clickhouse"
historical_backend = "parquet"
# Query workbench (requires clickhouse backend)
query_workbench_enabled = false
query_max_rows = 10000
query_timeout_secs = 30

[grpc]
enabled = false
listen_addr = "0.0.0.0:50051"

[logging]
level = "info"
format = "pretty"
