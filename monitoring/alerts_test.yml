# promtool rule unit tests for alerts.yml.
#
# Run: promtool test rules monitoring/alerts_test.yml
#
# These simulate incidents offline by feeding synthetic series and asserting the
# corresponding alert fires (and that a healthy signal does NOT fire). This is the
# "a simulated incident fires the alert" half of the monitoring story that does
# not need a live Prometheus/Alertmanager; live PagerDuty paging still needs a
# running stack.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # --- Data-loss class (critical) ---
  # 30s interval so the increase()[1m] window always holds >=2 samples.
  - interval: 30s
    name: WAL append failures page immediately
    input_series:
      - series: 'pb_wal_append_failures_total{instance="ingest-1"}'
        values: "0 0 1 2 3 4 5 6"
    alert_rule_test:
      # Healthy prefix: counter flat at 0, no increase, no alert.
      - eval_time: 30s
        alertname: WalAppendFailing
        exp_alerts: []
      # Incident: the counter is climbing, increase[1m] > 0, for:0s -> fires.
      - eval_time: 3m
        alertname: WalAppendFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: ingest-1
            exp_annotations:
              summary: "WAL append is failing on ingest-1"
              description: "The write-ahead log — the durability backbone — failed to append. Records are being lost. Almost always disk-full or a permissions/IO error on the WAL volume."
              runbook: monitoring/RUNBOOK.md#walappendfailing

  - interval: 1m
    name: WAL decode error pages
    input_series:
      - series: 'pb_wal_decode_errors_total{instance="serve-1"}'
        values: "0 0 1 2 3 4"
    alert_rule_test:
      - eval_time: 4m
        alertname: WalDecodeError
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: serve-1
            exp_annotations:
              summary: "WAL frame failed to decode during live tailing on serve-1"
              description: "A CRC-valid WAL frame could not be decoded by the codec and was skipped during live tailing — the serve read model has diverged from the WAL for that record. This should be near-impossible (a codec version mismatch or CRC collision). Investigate the WAL/codec version; strict `reconcile` refuses this frame and is not a repair for this alert."
              runbook: monitoring/RUNBOOK.md#waldecodeerror

  - interval: 1m
    name: Silent feed pages
    input_series:
      # A flat counter means rate == 0: no messages are being received.
      - series: 'pb_messages_received_total{instance="ingest-1"}'
        values: "100 100 100 100 100 100"
    alert_rule_test:
      - eval_time: 5m
        alertname: FeedSilent
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: ingest-1
            exp_annotations:
              summary: "No WebSocket messages received for 2m on ingest-1"
              description: "The feed has gone silent — either the venue WS is down or the client is stuck. Every second of silence is a capture gap."
              runbook: monitoring/RUNBOOK.md#feedsilent

  # --- Data-quality class (warning/info) ---
  - interval: 1m
    name: Stale feed warns
    input_series:
      - series: 'pb_feed_staleness_seconds{instance="ingest-1"}'
        values: "2 2 20 20 20 20"
    alert_rule_test:
      # Below threshold early: no alert.
      - eval_time: 1m
        alertname: FeedStale
        exp_alerts: []
      # Sustained above 15s past the for:5s window: fires.
      - eval_time: 5m
        alertname: FeedStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: ingest-1
            exp_annotations:
              summary: "Feed staleness 20s on ingest-1"
              description: "Time since the last applied update exceeds the staleness threshold. Sustained staleness during market hours indicates a stalled feed."
              runbook: monitoring/RUNBOOK.md#feedstale

  - interval: 1m
    name: Crossed book warns
    input_series:
      - series: 'pb_crossed_books_total{instance="ingest-1"}'
        values: "0 0 1 1 1 1"
    alert_rule_test:
      - eval_time: 4m
        alertname: CrossedBook
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: ingest-1
            exp_annotations:
              summary: "Crossed/locked book detected (best_bid >= best_ask)"
              description: "The live or replayed book crossed. Usually a missed delta or a stale-vs-fresh ordering problem; cross-check with BookMismatch."
              runbook: monitoring/RUNBOOK.md#crossedbook

  - interval: 1m
    name: Dropped resnapshot requests warn
    input_series:
      - series: 'pb_resnapshot_requests_dropped_total{instance="ingest-1"}'
        values: "0 0 1 2 3 4"
    alert_rule_test:
      - eval_time: 4m
        alertname: ResnapshotRequestsDropped
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: ingest-1
            exp_annotations:
              summary: "Self-heal resnapshot requests are being dropped (channel full)"
              description: "A book divergence was detected but the corrective resnapshot request could not be enqueued because the request channel was full. If many assets diverge at once, some assets' self-heal is skipped and their books stay corrupt until the next natural resnapshot. Correlate with BookMismatch volume."
              runbook: monitoring/RUNBOOK.md#resnapshotrequestsdropped

  # --- Backpressure class (warning) ---
  - interval: 1m
    name: WAL consumer lag warns after sustained breach
    input_series:
      # 300 MB > 256 MB threshold, sustained beyond the for:1m window.
      - series: 'pb_wal_consumer_lag_bytes{instance="serve-1"}'
        values: "300000000 300000000 300000000 300000000"
    alert_rule_test:
      - eval_time: 3m
        alertname: WalConsumerLagHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: serve-1
            exp_annotations:
              summary: "WAL consumer lag 286.1MiB on serve-1"
              description: "A WAL consumer (serve replica) is lagging beyond the retention window; if it falls behind pruning it will need a resync/re-hydrate."
              runbook: monitoring/RUNBOOK.md#walconsumerlaghigh

  - interval: 1m
    name: WS broadcast lag warns after sustained breach
    input_series:
      # Steady stream of lag events sustained past the for:1m window.
      - series: 'pb_ws_broadcast_lagged_total{instance="serve-1"}'
        values: "0 1 2 3 4 5"
    alert_rule_test:
      - eval_time: 4m
        alertname: WsBroadcastLagging
        exp_alerts:
          - exp_labels:
              severity: info
              instance: serve-1
            exp_annotations:
              summary: "WebSocket subscribers are lagging the broadcast buffer"
              description: "One or more streaming clients fell behind the per-asset broadcast buffer and were force-resynced. Occasional events are benign (a slow client); a sustained rate means the update rate exceeds what clients can consume — consider a larger BROADCAST_CAPACITY or client-side throttling."
              runbook: monitoring/RUNBOOK.md#wsbroadcastlagging

  # --- Liveness class (critical) ---
  - interval: 30s
    name: Target down pages after a minute
    input_series:
      - series: 'up{job="poly-book", instance="ingest-1"}'
        values: "1 1 1 1 0 0 0 0"
    alert_rule_test:
      # Healthy: target up, no alert.
      - eval_time: 1m
        alertname: TargetDown
        exp_alerts: []
      # Down for >1m: fires.
      - eval_time: 4m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: poly-book
              instance: ingest-1
            exp_annotations:
              summary: "poly-book process on ingest-1 is not being scraped"
              description: >-
                The scrape target is down: the process died, the host is gone, or the
                metrics listener stopped. Every other alert in this file is blind
                while this fires — rate()/increase() over an absent series returns an
                empty vector, so the worst failure mode (total process death) pages
                through this rule.
              runbook: monitoring/RUNBOOK.md#targetdown

  - interval: 1m
    name: Absent ingest series pages
    input_series:
      - series: 'up{job="unrelated"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: IngestAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No ingest metrics exist at all"
              description: >-
                pb_messages_received_total is absent from Prometheus — either no
                ingest process has ever come up, or its series aged out after a long
                outage. Belt-and-braces companion to TargetDown for setups where the
                job label does not match the up{} selector.
              runbook: monitoring/RUNBOOK.md#ingestabsent

  - interval: 1m
    name: Present ingest series does not page absent
    input_series:
      - series: 'pb_messages_received_total{instance="ingest-1"}'
        values: "0+100x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: IngestAbsent
        exp_alerts: []
