version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
    # One grouped PR per run instead of one PR per action bump, so the PR tab
    # and commit history stay readable.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    # Group minor+patch bumps into one PR per run; major bumps (potentially
    # breaking) still arrive as individual PRs for separate review.
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
