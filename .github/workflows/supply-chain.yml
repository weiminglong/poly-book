name: Supply Chain

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check dependencies and licenses
        run: cargo deny check advisories bans licenses sources

  iac-scan:
    name: Terraform IaC scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      # Static security scan of the Terraform: catches misconfigurations that
      # `terraform validate` cannot (public ingress, unencrypted buckets, mutable
      # image tags, over-broad egress/IAM). Intentional trade-offs are documented
      # with inline `#tfsec:ignore:<AVD-ID>` + rationale in the .tf files.
      - name: Install tfsec
        run: |
          curl -fsSL -o /tmp/tfsec \
            "https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64"
          chmod +x /tmp/tfsec
          sudo mv /tmp/tfsec /usr/local/bin/tfsec
      - name: tfsec
        run: tfsec infra/ --minimum-severity LOW

      - name: terraform fmt
        run: terraform -chdir=infra fmt -check -recursive

      - name: terraform validate
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
