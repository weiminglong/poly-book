name: Supply Chain

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check dependencies and licenses
        run: cargo deny check advisories bans licenses sources

  iac-scan:
    name: Terraform IaC scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # Static security scan of the Terraform: catches misconfigurations that
      # `terraform validate` cannot (public ingress, unencrypted buckets, mutable
      # image tags, over-broad egress/IAM). Intentional trade-offs are documented
      # with inline `#tfsec:ignore:<AVD-ID>` + rationale in the .tf files.
      - name: Install tfsec
        run: |
          curl -fsSL -o /tmp/tfsec \
            "https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64"
          chmod +x /tmp/tfsec
          sudo mv /tmp/tfsec /usr/local/bin/tfsec
      - name: tfsec
        run: tfsec infra/ --minimum-severity LOW

      # Provider-aware lint (invalid instance types, deprecated arguments, type
      # errors) — a class tfsec (security) and `terraform validate` (syntax) miss.
      # Downloaded directly (like tfsec/promtool/amtool) to avoid depending on a
      # third-party action SHA.
      - name: Install tflint
        run: |
          curl -fsSL -o /tmp/tflint.zip \
            "https://github.com/terraform-linters/tflint/releases/download/v0.63.1/tflint_linux_amd64.zip"
          unzip -o /tmp/tflint.zip -d /tmp >/dev/null
          sudo mv /tmp/tflint /usr/local/bin/tflint
      - name: tflint
        run: |
          tflint --chdir=infra --init
          tflint --chdir=infra

      - name: terraform fmt
        run: terraform -chdir=infra fmt -check -recursive

      - name: terraform validate
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
