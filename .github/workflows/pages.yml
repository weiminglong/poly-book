name: Deploy demo to GitHub Pages

# Publishes the SPA in backend-free demo mode so anyone can see the
# workstation (simulated live orderbook, replay, integrity, execution, query
# pages) without cloning or running anything.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vite build
        env:
          # Project-site subpath (https://<owner>.github.io/poly-book/).
          VITE_BASE_PATH: /poly-book/
          # No backend on Pages: demo is the default data source.
          VITE_DEFAULT_SOURCE_MODE: demo
      # SPA fallback: Pages serves 404.html for unknown paths, so deep links
      # (/replay, /orderbook, ...) load the app instead of a GitHub 404.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
