name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Jobs pin ubuntu-24.04 rather than ubuntu-latest: the floating label moved
# to 26.04 and the pinned Playwright release had no browser build for it.
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --all-targets

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace --exclude pb-integration-tests
      # Integration suite without Docker: the Parquet/hydration/replay
      # roundtrips. The S3 case is #[ignore]d and runs below against LocalStack.
      - run: cargo test -p pb-integration-tests

  integration-docker:
    name: Integration (Docker-backed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # LocalStack is the S3 emulator the object_store crate itself tests
      # against. (MinIO's public images were withdrawn from Docker Hub and
      # quay.io in 2025, which broke this job.) Pinned to a dated release.
      - name: Start LocalStack and create the integration bucket
        run: |
          docker run --detach --name pb-s3 \
            --publish 4566:4566 \
            --env SERVICES=s3 \
            localstack/localstack:2026.10.6
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4566/_localstack/health | grep -q '"s3": "\(available\|running\)"'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs pb-s3
              exit 1
            fi
            sleep 1
          done
          docker exec pb-s3 awslocal s3 mb s3://poly-book-test
      # The #[ignore]d case: the S3 roundtrip through the production
      # ParquetReader (persist, restart, read back over the object store).
      - run: cargo test -p pb-integration-tests -- --ignored --test-threads=1
        env:
          PB_TEST_S3_ENDPOINT: http://127.0.0.1:4566
          PB_TEST_S3_ACCESS_KEY: test
          PB_TEST_S3_SECRET_KEY: test

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  monitoring:
    name: Monitoring Rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Validate the Prometheus alert rules parse (PromQL + structure) and that a
      # simulated incident fires each alert (offline rule unit tests). Catches
      # alert-rule rot without needing a live Prometheus/Alertmanager.
      - name: Install promtool
        env:
          PROM_VERSION: "3.1.0"
        run: |
          curl -fsSL -o /tmp/prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar xzf /tmp/prom.tar.gz -C /tmp
          echo "/tmp/prometheus-${PROM_VERSION}.linux-amd64" >> "$GITHUB_PATH"
      - name: Check alert rules
        run: promtool check rules monitoring/alerts.yml
      - name: Test alert rules (simulated incidents)
        run: promtool test rules monitoring/alerts_test.yml

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx biome check .
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: web/dist/
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true

  docker-build:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Verify the production image actually builds.
      - run: docker build -t poly-book:ci .
