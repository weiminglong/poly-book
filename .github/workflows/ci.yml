name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: ./.github/actions/setup-protobuf
      - run: cargo check --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: ./.github/actions/setup-protobuf
      - run: cargo test --workspace --exclude pb-integration-tests
      # Integration suite. The ClickHouse-backed cases are #[ignore]d and
      # skipped here; the Parquet/hydration/replay roundtrips run.
      - run: cargo test -p pb-integration-tests

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: ./.github/actions/setup-protobuf
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  hygiene:
    name: Docs hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: No internal tracking references
        # Comments must carry their own rationale, not IDs that resolve to
        # nothing in the repo. Character classes keep this pattern from
        # matching its own definition.
        run: |
          if grep -rnE "[H]FT-review|[a]udit finding|[a]udit [A]\.[0-9]+|P[0-3]-[A-Z]+-[0-9]|\([A]\.[0-9]+\)" \
            --include="*.rs" --include="*.ts" --include="*.tsx" --include="*.toml" \
            --include="*.md" --include="*.proto" --include="*.yml" --include="justfile" \
            --include="Dockerfile" --exclude-dir=node_modules --exclude-dir=target .; then
            echo "::error::internal tracking references found; keep the rationale, drop the ID"
            exit 1
          fi

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # quick-xml DoS advisories with no upgrade path yet (object_store
          # pins quick-xml < 0.41). Rationale and removal condition are
          # documented on the matching ignore entries in deny.toml.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195

  monitoring:
    name: Monitoring Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Validate the Prometheus alert rules parse (PromQL + structure) and that a
      # simulated incident fires each alert (offline rule unit tests). Catches
      # alert-rule rot without needing a live Prometheus/Alertmanager.
      - name: Install promtool
        env:
          PROM_VERSION: "3.1.0"
        run: |
          curl -fsSL -o /tmp/prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar xzf /tmp/prom.tar.gz -C /tmp
          echo "/tmp/prometheus-${PROM_VERSION}.linux-amd64" >> "$GITHUB_PATH"
      - name: Check alert rules
        run: promtool check rules monitoring/alerts.yml
      - name: Test alert rules (simulated incidents)
        run: promtool test rules monitoring/alerts_test.yml
      # Validate the Alertmanager ROUTING config (where alerts page) the same way:
      # structure check + assert each severity routes to its intended receiver, so
      # the routing cannot drift from the alert rules' severity labels.
      - name: Install amtool
        env:
          AM_VERSION: "0.28.1"
        run: |
          curl -fsSL -o /tmp/am.tar.gz \
            "https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz"
          tar xzf /tmp/am.tar.gz -C /tmp
          echo "/tmp/alertmanager-${AM_VERSION}.linux-amd64" >> "$GITHUB_PATH"
      - name: Check Alertmanager config
        run: amtool check-config monitoring/alertmanager.yml
      - name: Test Alertmanager routing
        run: |
          set -euo pipefail
          assert_route() {
            local got
            got=$(amtool config routes test --config.file=monitoring/alertmanager.yml "severity=$1")
            if [ "$got" != "$2" ]; then
              echo "routing FAIL: severity=$1 routed to '$got', expected '$2'" >&2
              exit 1
            fi
            echo "ok: severity=$1 -> $got"
          }
          assert_route critical pagerduty-critical
          assert_route warning slack-warning
          assert_route info slack-info

  bench:
    name: Benchmarks (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: ./.github/actions/setup-protobuf
      # Compile every Criterion benchmark so the HFT latency harness (fixed-point,
      # wire deser, book ops, WAL append, dispatcher normalize, read model,
      # cross-backend) cannot silently rot. We do NOT run them to completion here:
      # statistical regression gating needs stable, dedicated hardware, not a
      # shared CI runner where noise produces false failures. Run `cargo bench`
      # locally against a committed baseline for perf-regression checks.
      - run: cargo bench --workspace --no-run

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx biome check .
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: web/dist/
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true

  fuzz:
    name: Fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-fuzz --locked || true
      - name: Fuzz WAL corruption (30s)
        run: cargo +nightly fuzz run fuzz_wal_corruption -- -max_total_time=30 -timeout=10
      - name: Fuzz book delta (30s)
        run: cargo +nightly fuzz run fuzz_book_delta -- -max_total_time=30 -timeout=10
      # Re-enabled after the query-guard hardening: identifier
      # blocklist + server-side readonly/limit enforcement.
      - name: Fuzz query guard (30s)
        run: cargo +nightly fuzz run fuzz_query_guard -- -max_total_time=30 -timeout=10
      # The deserialization-path targets: a malformed WS frame or
      # WAL codec frame must error, never panic the ingest/replay process.
      - name: Fuzz WS deserialization (30s)
        run: cargo +nightly fuzz run fuzz_ws_deser -- -max_total_time=30 -timeout=10
      - name: Fuzz WAL codec decode (30s)
        run: cargo +nightly fuzz run fuzz_codec_decode -- -max_total_time=30 -timeout=10
      - name: Fuzz fixed-point parse (30s)
        run: cargo +nightly fuzz run fuzz_fixed_price -- -max_total_time=30 -timeout=10

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: ./.github/actions/setup-protobuf
      # Compile the release profile (panic=abort, overflow-checks, LTO) so
      # release-only breakage surfaces in CI, not at deploy time.
      - run: cargo build --release --bin poly-book

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Verify the production image actually builds.
      - run: docker build -t poly-book:ci .

  miri:
    name: Miri (undefined behavior)
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Miri pb-types (unit tests only)
        run: cargo +nightly miri test -p pb-types -- --test-threads=1 --skip proptests
      - name: Miri pb-book (unit tests only)
        run: cargo +nightly miri test -p pb-book -- --test-threads=1 --skip proptests
